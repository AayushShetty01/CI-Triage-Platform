global:
  scrape_interval: 10s

scrape_configs:
  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:8001"]
  - job_name: parser
    static_configs:
      - targets: ["parser:8002"]
  - job_name: classifier
    static_configs:
      - targets: ["classifier:8003"]
  - job_name: classifier-worker
    static_configs:
      - targets: ["classifier-llm-worker:8004"]
  - job_name: query
    static_configs:
      - targets: ["query:8005"]
