name: Ingestion tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingestion-tests:
    name: Ingestion test suite
    runs-on: ubuntu-latest
    env:
      INGESTION_TEST_DATABASE_URL: postgresql+psycopg://triage_admin:triage_admin_ci@localhost:5432/ingestion_test
      INGESTION_TEST_RABBITMQ_URL: amqp://triage:triage_ci@localhost:5672/
      INGESTION_API_KEY: test-ingestion-api-key
      INTERNAL_API_KEY: test-internal-api-key
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ingestion_test
          POSTGRES_USER: triage_admin
          POSTGRES_PASSWORD: triage_admin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage_admin -d ingestion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: triage
          RABBITMQ_DEFAULT_PASS: triage_ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ingestion/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r services/ingestion/requirements-dev.txt

      - name: Run Ingestion unit, contract, and integration tests
        id: pytest
        run: |
          mkdir -p artifacts
          python -m pytest \
            -c services/ingestion/pytest.ini \
            services/ingestion/tests \
            --junitxml=artifacts/junit-report.xml

      - name: Add test case results to run summary
        if: always()
        env:
          TEST_REPORT: artifacts/junit-report.xml
          TEST_STEP_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          report_path = Path(os.environ["TEST_REPORT"])
          outcome = os.environ.get("TEST_STEP_OUTCOME", "unknown")

          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write("## Ingestion test results\n\n")
              if not report_path.is_file():
                  summary.write(
                      f"Pytest outcome: **{outcome}**. "
                      "JUnit report was not generated; check the test step logs.\n"
                  )
                  raise SystemExit(0)

              root = ElementTree.parse(report_path).getroot()
              cases = root.findall(".//testcase")
              passed = failed = errors = skipped = 0
              summary.write("| Result | Test case | Details |\n")
              summary.write("|---|---|---|\n")

              for case in cases:
                  failure = case.find("failure")
                  error = case.find("error")
                  skip = case.find("skipped")
                  if failure is not None:
                      result, detail = "FAIL", failure.get("message", failure.text or "")
                      failed += 1
                  elif error is not None:
                      result, detail = "ERROR", error.get("message", error.text or "")
                      errors += 1
                  elif skip is not None:
                      result, detail = "SKIPPED", skip.get("message", skip.text or "")
                      skipped += 1
                  else:
                      result, detail = "PASS", ""
                      passed += 1

                  name = ".".join(
                      part for part in (case.get("classname"), case.get("name")) if part
                  )
                  safe_name = name.replace("|", "\\|").replace("\n", " ")
                  safe_detail = " ".join(detail.split()).replace("|", "\\|")
                  summary.write(f"| {result} | `{safe_name}` | {safe_detail} |\n")

              summary.write(
                  f"\n**Passed:** {passed} · **Failed:** {failed} · "
                  f"**Errors:** {errors} · **Skipped:** {skipped} · "
                  f"**Pytest step:** {outcome}\n"
              )
          PY

      - name: Upload ingestion test reports and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-test-artifacts
          path: |
            artifacts/ingestion-test.log
            artifacts/junit-report.xml
            artifacts/ingestion-summary.txt
          if-no-files-found: warn
          retention-days: 7
