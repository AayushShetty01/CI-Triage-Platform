name: Ingestion failure tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestion-failure-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failure-tests:
    name: Compose failure tests and load smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ingestion/requirements-dev.txt

      - name: Install development requirements
        run: python -m pip install -r services/ingestion/requirements-dev.txt

      - name: Create development environment file
        run: cp .env.example .env

      - name: Start Docker Compose stack
        id: compose_up
        run: docker compose up -d --build

      - name: Wait for Compose services to become healthy
        run: |
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://localhost:8001/health >/dev/null \
              && docker compose exec -T postgres pg_isready -U triage_admin -d triage >/dev/null 2>&1 \
              && docker compose exec -T rabbitmq rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              echo "PostgreSQL, RabbitMQ, and Ingestion are responsive."
              exit 0
            fi
            if [ "$attempt" -eq 90 ]; then
              docker compose ps
              docker compose logs --no-color --timestamps
              echo "Timed out waiting for the Compose stack to become healthy." >&2
              exit 1
            fi
            sleep 2
          done

      - name: Run real failure-injection scenarios
        run: make failure-tests

      - name: Run load smoke
        if: ${{ always() && steps.compose_up.outcome == 'success' }}
        run: make load-test

      - name: Add failure scenario results to job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          scenario_names = (
              "broker_down",
              "database_down",
              "crash_with_unpublished_rows",
              "kill_during_uploads",
              "broker_flapping",
              "concurrent_duplicates",
          )
          evidence_root = Path(
              "services/ingestion/failure_simulation/evidence"
          )
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          def count_value(counts, primary, *list_fallbacks):
              value = counts.get(primary)
              if value is not None:
                  return value
              for key in list_fallbacks:
                  value = counts.get(key)
                  if isinstance(value, list):
                      return len(value)
              return None

          with summary_path.open("a", encoding="utf-8") as output:
              output.write("## Docker Compose failure scenarios\n\n")
              output.write(
                  "| Scenario | Result | Acknowledged | Stored | Published | "
                  "Duplicates | Drained | Recovery to pending 0 (s) |\n"
              )
              output.write("|---|---|---:|---:|---:|---:|---:|---:|\n")

              for scenario in scenario_names:
                  report = evidence_root / scenario / "summary.json"
                  if not report.is_file():
                      output.write(
                          f"| `{scenario}` | NOT RUN | — | — | — | — | — | — |\n"
                      )
                      continue

                  data = json.loads(report.read_text(encoding="utf-8"))
                  counts = data.get("measured_counts") or {}
                  result = "PASS" if data.get("passed") is True else "FAIL"
                  acknowledged = count_value(
                      counts,
                      "acknowledged_count",
                      "acknowledged_run_ids",
                      "accepted_run_ids",
                  )
                  stored = counts.get("stored_count")
                  published = counts.get("published_count")
                  duplicates = count_value(
                      counts, "duplicate_count", "duplicated_run_ids"
                  )
                  drained = counts.get("drained_message_count")
                  recovery = counts.get("recovery_to_pending_zero_seconds")
                  cells = (acknowledged, stored, published, duplicates, drained, recovery)
                  rendered = tuple("—" if value is None else str(value) for value in cells)
                  output.write(
                      f"| `{scenario}` | {result} | "
                      + " | ".join(rendered)
                      + " |\n"
                  )
          PY

      - name: Dump Docker Compose logs
        if: always()
        run: |
          mkdir -p artifacts
          set +e
          docker compose logs --no-color --timestamps > artifacts/compose-logs.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::docker compose logs exited with status $status"
          fi

      - name: Upload failure evidence, load smoke, and Compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-failure-and-load-artifacts
          path: |
            services/ingestion/failure_simulation/evidence/
            artifacts/load-smoke/
            artifacts/compose-logs.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
