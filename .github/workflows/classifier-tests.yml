name: Classifier tests

on:
  push:
    paths:
      - "services/classifier/**"
      - "contracts/**"
      - ".github/workflows/classifier-tests.yml"
  pull_request:
    paths:
      - "services/classifier/**"
      - "contracts/**"
      - ".github/workflows/classifier-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/classifier
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/classifier/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Classifier unit, contract, and worker tests
        run: python -m pytest -c pytest.ini tests --junitxml=junit-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classifier-test-report
          path: services/classifier/junit-report.xml
          if-no-files-found: warn
          retention-days: 7
