name: CI Triage Live Demo

on:
  push:
    branches: [ '**' ]

jobs:
  test-and-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pytest
        run: pip install pytest

      - name: Run Tests (Generates JUnit XML)
        id: run_tests
        continue-on-error: true  # Don't abort when the test fails!
        run: |
          mkdir -p reports
          pytest --junitxml=reports/junit.xml tests/

      - name: Send Failure Report to Your Local Frontend Stack
        if: always()
        env:
          TRIAGE_INGESTION_URL: ${{ secrets.TRIAGE_INGESTION_URL }} # https://snaking-pointless-chitchat.ngrok-free.dev
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}             # dev-ingestion-key-change-me
        run: |
          if [ -f reports/junit.xml ]; then
            echo "Sending failure report to Ingestion Service..."
            curl -v -X POST "$TRIAGE_INGESTION_URL/runs" \
              -H "X-API-Key: $TRIAGE_API_KEY" \
              -H "Content-Type: application/xml" \
              -H "X-Commit-SHA: $GITHUB_SHA" \
              -H "X-Branch: $GITHUB_REF_NAME" \
              --data-binary "@reports/junit.xml"
          fi
