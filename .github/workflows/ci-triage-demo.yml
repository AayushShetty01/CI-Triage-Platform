name: CI Triage Live Demo

on:
  push:
    branches: [ '**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pytest
        run: pip install pytest

      - name: Run Tests & Generate JUnit XML
        id: run_tests
        continue-on-error: true
        run: |
          pytest --junitxml=reports/junit.xml tests/

      - name: Send Report to CI-Triage-Platform
        if: always()
        env:
          TRIAGE_INGESTION_URL: ${{ secrets.TRIAGE_INGESTION_URL }}
          TRIAGE_API_KEY: ${{ secrets.TRIAGE_API_KEY }}
        run: |
          if [ -f reports/junit.xml ]; then
            echo "Uploading report to $TRIAGE_INGESTION_URL/runs..."
            curl -v -X POST "$TRIAGE_INGESTION_URL/runs" \
              -H "X-API-Key: $TRIAGE_API_KEY" \
              -H "Content-Type: application/xml" \
              -H "X-Commit-SHA: $GITHUB_SHA" \
              -H "X-Branch: $GITHUB_REF_NAME" \
              --data-binary "@reports/junit.xml"
          else
            echo "No JUnit report found."
          fi
