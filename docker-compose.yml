services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-triage_admin_dev}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:-ingestion_dev}
      PARSER_DB_PASSWORD: ${PARSER_DB_PASSWORD:-parser_dev}
      CLASSIFIER_DB_PASSWORD: ${CLASSIFIER_DB_PASSWORD:-classifier_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-ingestion.sh:/docker-entrypoint-initdb.d/10-ingestion.sh:ro
      - ./infra/postgres/init-parser.sh:/docker-entrypoint-initdb.d/20-parser.sh:ro
      - ./infra/postgres/init-classifier.sh:/docker-entrypoint-initdb.d/30-classifier.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage_admin -d triage"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-triage}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-triage_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build:
      context: ./services/ingestion
    environment:
      DATABASE_URL: postgresql+psycopg://ingestion:${INGESTION_DB_PASSWORD:-ingestion_dev}@postgres:5432/triage
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-triage}:${RABBITMQ_PASSWORD:-triage_dev}@rabbitmq:5672/
      MAX_REPORT_SIZE_BYTES: ${MAX_REPORT_SIZE_BYTES:-10485760}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      RELAY_POLL_INTERVAL_SECONDS: ${RELAY_POLL_INTERVAL_SECONDS:-${OUTBOX_POLL_INTERVAL_SECONDS:-1}}
      RELAY_BACKOFF_CAP_SECONDS: ${RELAY_BACKOFF_CAP_SECONDS:-30}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      INGESTION_RETRY_AFTER_SECONDS: ${INGESTION_RETRY_AFTER_SECONDS:-5}
      INGESTION_API_KEY: ${INGESTION_API_KEY:-dev-ingestion-key-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8001:8001"

  parser:
    build:
      context: ./services/parser
    environment:
      DATABASE_URL: postgresql+psycopg://parser:${PARSER_DB_PASSWORD:-parser_dev}@postgres:5432/triage
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-triage}:${RABBITMQ_PASSWORD:-triage_dev}@rabbitmq:5672/
      INGESTION_BASE_URL: http://ingestion:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      RELAY_POLL_INTERVAL_SECONDS: ${RELAY_POLL_INTERVAL_SECONDS:-${OUTBOX_POLL_INTERVAL_SECONDS:-1}}
      RELAY_BACKOFF_CAP_SECONDS: ${RELAY_BACKOFF_CAP_SECONDS:-30}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ingestion:
        condition: service_started
    ports:
      - "8002:8002"

  ollama:
    image: ollama/ollama:0.12.6
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: downloads the model into the ollama volume (skipped quickly once present).
  ollama-pull:
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # API + FailuresExtracted consumer + outbox relay. Never calls the LLM.
  classifier:
    build:
      context: ./services/classifier
    environment: &classifier-env
      DATABASE_URL: postgresql+psycopg://classifier:${CLASSIFIER_DB_PASSWORD:-classifier_dev}@postgres:5432/triage
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-triage}:${RABBITMQ_PASSWORD:-triage_dev}@rabbitmq:5672/
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      RELAY_POLL_INTERVAL_SECONDS: ${RELAY_POLL_INTERVAL_SECONDS:-${OUTBOX_POLL_INTERVAL_SECONDS:-1}}
      RELAY_BACKOFF_CAP_SECONDS: ${RELAY_BACKOFF_CAP_SECONDS:-30}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      # Set OLLAMA_BASE_URL=http://host.docker.internal:11434 to use Ollama installed on the host.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      LLM_DEGRADE_AFTER_SECONDS: ${LLM_DEGRADE_AFTER_SECONDS:-120}
      BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-5}
      BREAKER_RESET_SECONDS: ${BREAKER_RESET_SECONDS:-30}
      ENABLE_CONSUMER: "true"
      ENABLE_RELAY: "true"
      ENABLE_LLM_WORKER: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8003:8003"

  # Separate LLM worker pool: claims llm_jobs, calls Ollama behind a circuit breaker.
  # Migrations are run by the classifier container, so this one only starts the app.
  classifier-llm-worker:
    build:
      context: ./services/classifier
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8004", "--no-access-log"]
    environment:
      <<: *classifier-env
      ENABLE_CONSUMER: "false"
      ENABLE_RELAY: "false"
      ENABLE_LLM_WORKER: "true"
      LLM_WORKERS: ${LLM_WORKERS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      classifier:
        condition: service_started
      ollama:
        condition: service_healthy
    ports:
      - "8004:8004"

volumes:
  postgres_data:
  ollama_data:
